name: vinva-gastronomy
services:
  api:
    container_name: api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnectionString: Host=db;Port=5432;Database=Gastronomy;Username=postgres;Password=${POSTGRES_PASSWORD}
    restart: unless-stopped

  nginx:
    container_name: host
    ports:
      - "80:80"
      - "443:443"
    volumes:      
      - ./_configs/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

  db:
    container_name: db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped